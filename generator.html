<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan - Neysa & Putra</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Luxury -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050203;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-deep);
            color: #E2E8F0;
            overflow-x: hidden;
        }

        .font-serif-luxury { font-family: 'Cormorant Garamond', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-script { font-family: 'Alex Brush', cursive; }

        .text-gold {
            background: linear-gradient(135deg, #FFF5D6 0%, #E2B963 40%, #C59B27 75%, #A3791A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .bg-gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #EDD68A 35%, #B38728 75%, #8C620D 100%);
        }

        .bg-hero {
            background: linear-gradient(to bottom, rgba(5, 2, 3, 0.7) 0%, rgba(5, 2, 3, 0.9) 60%, rgba(5, 2, 3, 0.98) 100%), 
                        url("images/eca-putra.jpeg") !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }

        .glass-card {
            background: linear-gradient(180deg, rgba(18, 9, 13, 0.85) 0%, rgba(7, 3, 5, 0.96) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .glass-inner {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .gold-border-box {
            position: relative;
        }
        .gold-border-box::before {
            content: '';
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            pointer-events: none;
            border-radius: 1.25rem;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050203; }
        ::-webkit-scrollbar-thumb { background: #C59B27; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#050203] text-stone-200 antialiased min-h-screen relative flex items-center justify-center p-4 bg-hero">

    <!-- AMBIENT LIGHTING -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-full pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-5%] left-[-5%] w-[450px] h-[450px] bg-rose-950/25 blur-[130px] rounded-full"></div>
        <div class="absolute bottom-[5%] right-[-5%] w-[500px] h-[500px] bg-amber-950/20 blur-[150px] rounded-full"></div>
    </div>

    <!-- MAIN GENERATOR CARD -->
    <div class="w-full max-w-md relative z-10 py-6">
        <div class="glass-card rounded-3xl p-8 sm:p-10 text-center space-y-8 gold-border-box">
            
            <!-- HEADER -->
            <div class="space-y-3 pt-2">
                <span class="font-cinzel text-[9px] uppercase tracking-[0.5em] text-amber-200/90 block">Invitation Generator</span>
                <div class="w-8 h-[1px] bg-amber-400/40 mx-auto"></div>
                <h1 class="font-serif-luxury text-4xl text-gold font-light tracking-wide">Neysa & Putra</h1>
                <p class="text-[11px] text-stone-400 font-light pt-1">Buat tautan undangan khusus untuk tamu dengan mudah.</p>
            </div>

            <!-- FORM INPUT -->
            <div class="space-y-4 text-left">
                <div>
                    <label class="block font-cinzel text-[9px] text-amber-200/80 uppercase tracking-widest mb-2">Nama Tamu Undangan</label>
                    <input type="text" id="guestInput" placeholder="Contoh: Budi & Partner" class="w-full px-4 py-3.5 text-xs bg-white/5 border border-amber-400/20 rounded-xl text-white placeholder-stone-600 focus:border-amber-400/50 focus:outline-none transition">
                </div>

                <button onclick="generateLink()" class="w-full py-3.5 bg-gold-gradient text-stone-950 font-cinzel text-[10px] font-bold tracking-[0.2em] rounded-xl shadow-[0_0_20px_rgba(212,175,55,0.2)] hover:brightness-110 transition uppercase flex items-center justify-center gap-2">
                    <i class="fas fa-link text-xs"></i> Buat Link Undangan
                </button>
            </div>

            <!-- RESULT AREA (HIDDEN BY DEFAULT) -->
            <div id="resultArea" class="hidden space-y-4 pt-4 border-t border-amber-500/20 text-left">
                <span class="font-cinzel text-[9px] text-amber-200 uppercase tracking-widest block text-center">Link Berhasil Dibuat!</span>
                
                <div class="p-3.5 rounded-xl glass-inner flex items-center justify-between gap-2">
                    <input type="text" id="resultLink" readonly class="bg-transparent text-[11px] text-stone-300 w-full focus:outline-none truncate">
                    <button onclick="copyLink()" class="px-3.5 py-2 bg-amber-400/20 hover:bg-amber-400/30 text-amber-200 rounded-lg text-xs transition flex items-center gap-1.5 shrink-0 font-cinzel tracking-wider">
                        <i class="far fa-copy"></i> Salin
                    </button>
                </div>

                <a id="whatsappShareBtn" href="#" target="_blank" class="w-full py-3 bg-emerald-700/80 hover:bg-emerald-600 text-white font-cinzel text-[10px] font-bold tracking-[0.15em] rounded-xl transition uppercase flex items-center justify-center gap-2 shadow-lg">
                    <i class="fab fa-whatsapp text-sm"></i> Bagikan ke WhatsApp
                </a>
            </div>

        </div>
        
        <p class="text-center text-[10px] font-cinzel text-amber-200/40 tracking-[0.3em] uppercase mt-6">&copy; 2026 Neysa & Putra</p>
    </div>

    <script>
        function generateLink() {
            const guestName = document.getElementById('guestInput').value.trim();
            if (!guestName) {
                alert('Silakan masukkan nama tamu terlebih dahulu!');
                return;
            }

            // Ganti URL di bawah ini dengan domain Vercel Anda nanti (misal: https:// undangan-anda.vercel.app/)
            const baseUrl = window.location.origin + window.location.pathname.replace('generator.html', 'index.html');
            const encodedName = encodeURIComponent(guestName);
            const finalLink = `${baseUrl}?to=${encodedName}`;

            document.getElementById('resultLink').value = finalLink;
            document.getElementById('resultArea').classList.remove('hidden');

            // Format pesan otomatis untuk WhatsApp
            const waMessage = `Kepada Yth. Bapak/Ibu/Saudara/i\n*${guestName}*,\n\nTanpa mengurangi rasa hormat, kami mengundang Anda untuk menghadiri acara pernikahan kami.\n\nBerikut link undangan Anda:\n${finalLink}\n\nMerupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir.\n\nTerima kasih,\nNeysa & Putra`;
            
            document.getElementById('whatsappShareBtn').href = `https://wa.me/?text=${encodeURIComponent(waMessage)}`;
        }

        function copyLink() {
            const linkInput = document.getElementById('resultLink');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); // Untuk perangkat mobile
            navigator.clipboard.writeText(linkInput.value);
            alert('Link undangan berhasil disalin!');
        }
    </script>
</body>
</html>
