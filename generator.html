<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Generator Link Undangan Putra & Neysa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #1c080d;
            overflow-x: hidden;
        }

        .bg-luxury-atmosphere {
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(128, 0, 32, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 90% 40%, rgba(245, 230, 211, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 10% 70%, rgba(80, 10, 22, 0.7) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(28, 8, 13, 0.98) 0%, transparent 80%);
            background-attachment: fixed;
        }

        .font-serif-luxury { font-family: 'Cormorant Garamond', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }

        .text-gold {
            background: linear-gradient(135deg, #FFF1C1 0%, #D4AF37 35%, #FFE8A3 60%, #AA771C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.25));
        }
        
        .bg-gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #FFF3D6 25%, #C59B27 65%, #966B13 100%);
        }

        .glass-card-pearl {
            background: linear-gradient(145deg, rgba(245, 230, 211, 0.08) 0%, rgba(55, 12, 22, 0.75) 100%);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                        0 0 25px rgba(128, 0, 32, 0.25),
                        inset 0 1px 2px rgba(255, 241, 193, 0.3),
                        inset 0 -1px 2px rgba(0, 0, 0, 0.8);
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        .orb-1 { top: 10%; left: -10%; width: 350px; height: 350px; background: rgba(140, 15, 38, 0.6); }
        .orb-2 { bottom: 15%; right: -5%; width: 400px; height: 400px; background: rgba(212, 175, 55, 0.2); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1c080d; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(#D4AF37, #966B13); border-radius: 4px; }
    </style>
</head>
<body class="bg-luxury-atmosphere text-stone-100 antialiased min-h-screen relative flex items-center justify-center p-4">

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="w-full max-w-lg relative z-10 space-y-6">
        
        <!-- Header Admin -->
        <div class="text-center space-y-2">
            <span class="font-cinzel text-xs tracking-[0.4em] text-amber-200 uppercase">Admin Panel</span>
            <h1 class="font-serif-luxury text-4xl text-gold font-normal">Generator Undangan</h1>
            <p class="font-cinzel text-[11px] text-stone-300 tracking-wider">Putra & Neysa Wedding</p>
        </div>

        <!-- Card Generator -->
        <div class="glass-card-pearl rounded-3xl p-8 space-y-6">
            <div class="space-y-2 text-center">
                <h2 class="font-serif-luxury text-2xl text-gold">Buat Tautan Undangan Tamu</h2>
                <p class="text-[11px] text-stone-300 leading-relaxed">Masukkan nama tamu di bawah ini untuk menghasilkan format pesan WhatsApp beserta link undangannya secara otomatis.</p>
            </div>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block font-cinzel text-[10px] text-amber-200 uppercase tracking-wider mb-1">Nama Tamu Undangan</label>
                    <input type="text" id="genGuestName" oninput="generateInvitationText()" class="w-full px-4 py-3 text-xs bg-white/10 border border-amber-400/30 rounded-xl text-white placeholder-stone-400 focus:border-amber-300 focus:outline-none" placeholder="Masukkan nama tamu undangan">
                </div>

                <div>
                    <label class="block font-cinzel text-[10px] text-amber-200 uppercase tracking-wider mb-1">Hasil Templat Pesan</label>
                    <textarea id="genTemplateResult" rows="7" readonly class="w-full px-4 py-3 text-[11px] bg-stone-950/60 border border-amber-400/30 rounded-xl text-stone-200 focus:outline-none resize-none font-sans"></textarea>
                </div>

                <button type="button" onclick="copyGeneratedTemplate()" class="w-full py-3.5 bg-gold-gradient text-stone-950 font-cinzel text-xs font-bold tracking-widest rounded-xl shadow-[0_0_20px_rgba(212,175,55,0.4)] hover:brightness-110 transition flex items-center justify-center gap-2">
                    <i class="fas fa-copy text-xs"></i> Salin Pesan & Tautan Undangan
                </button>
            </div>

            <div class="pt-4 border-t border-amber-400/20 text-center">
                <a href="index.html" target="_blank" class="text-xs text-amber-300 hover:underline font-cinzel tracking-wider">
                    <i class="fas fa-external-link-alt mr-1"></i> Lihat Halaman Utama Undangan
                </a>
            </div>
        </div>

        <footer class="text-center text-[10px] font-cinzel text-amber-200/50 tracking-widest">
            &copy; 2026 Putra & Neysa. All Rights Reserved.
        </footer>
    </div>

    <!-- JAVASCRIPT GENERATOR -->
    <script>
        function generateInvitationText() {
            let nameInput = document.getElementById('genGuestName').value.trim();
            if (!nameInput) nameInput = "Nama Tamu";
            
            let currentUrl = window.location.href;
            let baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + '/index.html';
            let encodedName = encodeURIComponent(nameInput);
            let fullLink = `${baseUrl}?to=${encodedName}`;

            let template = `Bismillahirrahmanirrahim.\n\nAssalamu’alaikum Warahmatullahi Wabarakatuh & Salam Sejahtera.\n\nTanpa mengurangi rasa hormat, kami bermaksud mengundang Bapak/Ibu/Saudara/i (${nameInput}) untuk menghadiri acara pernikahan kami:\n\nSafrizal Saputra & Neysa Phillo Vania Lalela\n\nInformasi lengkap mengenai waktu dan tempat acara dapat diakses melalui tautan berikut:\n🔗 ${fullLink}\n\nMerupakan suatu kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir. Terima kasih atas doa restunya.\n\nWassalamu’alaikum Warahmatullahi Wabarakatuh.\n\nKami yang berbahagia,\nPutra & Neysa`;

            document.getElementById('genTemplateResult').value = template;
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateInvitationText();
        });

        function copyGeneratedTemplate() {
            const textarea = document.getElementById('genTemplateResult');
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            alert('Pesan dan tautan undangan berhasil disalin! Silakan tempel di WhatsApp.');
        }
    </script>
</body>
</html>
